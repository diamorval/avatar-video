[project]
name = "avatar-video"
version = "0.1.0"
description = "Vidéos tuto avec avatar IA, backends Mac (MLX) et GPU (ComfyUI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "mcp>=2.3,<3",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
chatterbox = ["chatterbox-tts", "torchaudio"]
omnivoice = ["omnivoice", "torchaudio"]

[project.scripts]
avatar = "avatar.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avatar"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
# chatterbox-tts et omnivoice épinglent des versions incompatibles de torch/transformers.
conflicts = [[{ extra = "chatterbox" }, { extra = "omnivoice" }]]
